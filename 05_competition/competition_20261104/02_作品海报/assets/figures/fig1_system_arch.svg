<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2740"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e8fa8"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <linearGradient id="gDDR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314d"/>
      <stop offset="1" stop-color="#0b1f31"/>
    </linearGradient>
    <style>
      .box{fill:#ffffff;stroke:#0f2740;stroke-width:2}
      .boxA{fill:#eaf6f8;stroke:#0e8fa8;stroke-width:2}
      .boxD{fill:#0f2740;stroke:#0f2740;stroke-width:2}
      .t{fill:#0f2740;font-size:19px;font-weight:600}
      .s{fill:#3f5a70;font-size:14px}
      .tw{fill:#ffffff;font-size:19px;font-weight:600}
      .sw{fill:#a8c8d8;font-size:14px}
      .lbl{fill:#0e8fa8;font-size:14px;font-weight:600}
      .lblD{fill:#b45309;font-size:14px;font-weight:600}
      .areaLabel{fill:#7d94a6;font-size:14px;letter-spacing:2px}
      .flow{fill:none;stroke:#0f2740;stroke-width:2.2}
      .flowA{fill:none;stroke:#0e8fa8;stroke-width:2.2}
      .flowD{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5}
    </style>
  </defs>

  <rect width="1500" height="820" fill="#ffffff"/>

  <!-- 分区标签 -->
  <text class="areaLabel" x="50" y="34">① 采集与显示链路</text>
  <text class="areaLabel" x="480" y="34">② 帧缓存</text>
  <text class="areaLabel" x="1000" y="34">③ 矫正处理链路</text>

  <!-- 采集链 -->
  <rect class="box" x="50" y="60" width="250" height="92" rx="8"/>
  <text class="t" x="70" y="94">Canon EOS R50</text>
  <text class="s" x="70" y="120">18 mm 定焦 · HDMI 1080p60</text>
  <text class="s" x="70" y="140">固定机位 / 外接监视器</text>

  <rect class="box" x="50" y="196" width="250" height="96" rx="8"/>
  <text class="t" x="70" y="230">HDMI 接收 · MS7200</text>
  <text class="s" x="70" y="256">EDID 协商 / 时序锁定</text>
  <text class="s" x="70" y="276">I²C 寄存器配置与重连</text>

  <rect class="boxA" x="50" y="336" width="250" height="108" rx="8"/>
  <text class="t" x="70" y="370">双 Bank 视频采集</text>
  <text class="s" x="70" y="396">整帧对齐 · 行/场有效性校验</text>
  <text class="s" x="70" y="416">乒乓切换 · 帧代数登记</text>
  <text class="s" x="70" y="436">坏帧拒绝 / 丢帧计数</text>

  <!-- 上位机 -->
  <rect class="box" x="50" y="560" width="250" height="104" rx="8"/>
  <text class="t" x="70" y="594">上位机角度面板</text>
  <text class="s" x="70" y="620">旋转 / 缩放 / 平移参数</text>
  <text class="s" x="70" y="640">UART 115200 8N1 · CRC16</text>

  <!-- DDR -->
  <rect x="480" y="60" width="340" height="470" rx="10" fill="url(#gDDR)" stroke="#0f2740" stroke-width="2"/>
  <text class="tw" x="500" y="98">DDR3 帧缓存 · x32</text>
  <text class="sw" x="500" y="122">125 MHz UI · 256 位突发</text>

  <rect x="504" y="140" width="292" height="58" rx="6" fill="#1c4a6b" stroke="#3d7597"/>
  <text class="tw" x="520" y="164" font-size="17">源图 Bank 0</text>
  <text class="sw" x="520" y="186" font-size="13">1920 × 1080 × RGB888</text>

  <rect x="504" y="210" width="292" height="58" rx="6" fill="#1c4a6b" stroke="#3d7597"/>
  <text class="tw" x="520" y="234" font-size="17">源图 Bank 1</text>
  <text class="sw" x="520" y="256" font-size="13">乒乓写入 · 与处理帧隔离</text>

  <rect x="504" y="280" width="292" height="58" rx="6" fill="#1c4a6b" stroke="#3d7597"/>
  <text class="tw" x="520" y="304" font-size="17">结果帧区</text>
  <text class="sw" x="520" y="326" font-size="13">1920 × 1080 · 双缓冲</text>

  <rect x="504" y="352" width="292" height="150" rx="6" fill="#163c57" stroke="#3d7597"/>
  <text class="tw" x="520" y="376" font-size="17">访问仲裁</text>
  <text class="sw" x="520" y="400" font-size="13">采集写入 · 源行读取</text>
  <text class="sw" x="520" y="422" font-size="13">结果写回 · 显示预取</text>
  <text class="sw" x="520" y="444" font-size="13">单笔事务 · 超时看门狗</text>
  <text class="sw" x="520" y="466" font-size="13">DDR 自检与恢复</text>

  <!-- 处理链 -->
  <rect class="boxA" x="1000" y="60" width="300" height="110" rx="8"/>
  <text class="t" x="1020" y="94">坐标变换</text>
  <text class="s" x="1020" y="120">目标像素 → 理想源坐标</text>
  <text class="s" x="1020" y="140">逆仿射 Q24 + Brown k1/k2/p1/p2</text>
  <text class="s" x="1020" y="160">11 级定点流水线</text>

  <rect class="boxA" x="1000" y="206" width="300" height="110" rx="8"/>
  <text class="t" x="1020" y="240">四邻域分块缓存</text>
  <text class="s" x="1020" y="266">128 行缓存 · 双 Bank 读口</text>
  <text class="s" x="1020" y="286">128 × 128 分块 · 64 像素突发</text>
  <text class="s" x="1020" y="306">按帧代数失效 · 命中/缺失统计</text>

  <rect class="boxA" x="1000" y="352" width="300" height="96" rx="8"/>
  <text class="t" x="1020" y="386">单次重采样插值</text>
  <text class="s" x="1020" y="412">双线性（UQ0.8） / 最近邻</text>
  <text class="s" x="1020" y="432">3 级流水 · 边界填黑</text>

  <rect class="boxA" x="1000" y="484" width="300" height="96" rx="8"/>
  <text class="t" x="1020" y="518">结果写回</text>
  <text class="s" x="1020" y="544">按真实输出地址 · 64 像素连续写</text>
  <text class="s" x="1020" y="564">整帧完成后发布新代</text>

  <!-- 显示链 -->
  <rect class="box" x="480" y="620" width="200" height="100" rx="8"/>
  <text class="t" x="500" y="654" font-size="18">显示预取</text>
  <text class="s" x="500" y="680">双行缓冲</text>
  <text class="s" x="500" y="700">整帧边界切换</text>

  <rect class="box" x="720" y="620" width="200" height="100" rx="8"/>
  <text class="t" x="740" y="654" font-size="18">视频时序 VTC</text>
  <text class="s" x="740" y="680">1920×1080p30</text>
  <text class="s" x="740" y="700">74.25 MHz</text>

  <rect class="box" x="960" y="620" width="190" height="100" rx="8"/>
  <text class="t" x="980" y="654" font-size="18">HDMI 发送</text>
  <text class="s" x="980" y="680">MS7210 · RGB888</text>
  <text class="s" x="980" y="700">I²C 配置</text>

  <rect class="box" x="1190" y="620" width="250" height="100" rx="8"/>
  <text class="t" x="1210" y="654" font-size="18">采集卡 / 显示器</text>
  <text class="s" x="1210" y="680">VC-002Pro → OBS</text>
  <text class="s" x="1210" y="700">实时预览与录制</text>

  <!-- 箭头：采集链 -->
  <path class="flow" d="M175,152 L175,196" marker-end="url(#ar)"/>
  <path class="flow" d="M175,292 L175,336" marker-end="url(#ar)"/>
  <path class="flow" d="M300,390 L480,390" marker-end="url(#ar)"/>
  <text class="lbl" x="322" y="378">写入源帧</text>

  <!-- 箭头：DDR 与处理 -->
  <path class="flow" d="M820,262 L1000,262" marker-end="url(#ar)"/>
  <path class="flow" d="M1000,236 L820,236" marker-end="url(#ar)"/>
  <text class="lbl" x="836" y="224">读源行</text>
  <path class="flow" d="M1150,170 L1150,206" marker-end="url(#ar)"/>
  <path class="flow" d="M1150,316 L1150,352" marker-end="url(#ar)"/>
  <path class="flow" d="M1150,448 L1150,484" marker-end="url(#ar)"/>
  <path class="flow" d="M1000,505 L828,505" marker-end="url(#ar)"/>
  <text class="lbl" x="842" y="528">写回结果</text>

  <!-- 显示 -->
  <path class="flow" d="M650,530 L650,620" marker-end="url(#ar)"/>
  <text class="lbl" x="662" y="580">结果帧</text>
  <path class="flow" d="M680,670 L720,670" marker-end="url(#ar)"/>
  <path class="flow" d="M920,670 L960,670" marker-end="url(#ar)"/>
  <path class="flow" d="M1150,670 L1190,670" marker-end="url(#ar)"/>

  <!-- 上位机参数 -->
  <path class="flowD" d="M300,590 L400,590 L400,50 L1150,50 L1150,60" marker-end="url(#arD)"/>
  <text class="lblD" x="712" y="44">六项 signed40/Q24 参数 · 帧边界锁存</text>

  <!-- 时钟 -->
  <line x1="50" y1="756" x2="1450" y2="756" stroke="#c9d7e0" stroke-width="1.5"/>
  <text class="s" x="50" y="782">时钟域：27 MHz 配置 / UART　·　148.5 MHz 输入像素　·　92.8125 MHz 处理　·　125 MHz DDR UI　·　74.25 MHz 输出像素</text>
  <text class="s" x="50" y="804">跨域：双 Bank 帧代数 + 参数邮箱（整组快照）　·　复位：DDR 恢复不重置参数邮箱，整机硬复位取消未提交事务</text>
</svg>
