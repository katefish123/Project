<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2740"/>
    </marker>
    <style>
      .h{fill:#0f2740;font-size:20px;font-weight:700}
      .n{fill:#3f5a70;font-size:14px}
      .byte{fill:#ffffff;stroke:#0f2740;stroke-width:1.6}
      .bH{fill:#0f2740;stroke:#0f2740;stroke-width:1.6}
      .bP{fill:#eaf6f8;stroke:#0e8fa8;stroke-width:1.6}
      .bC{fill:#fdf1e3;stroke:#b45309;stroke-width:1.6}
      .bt{fill:#0f2740;font-family:Consolas, monospace;font-size:13px}
      .bw{fill:#ffffff;font-family:Consolas, monospace;font-size:13px}
      .lbl{fill:#0f2740;font-size:15px;font-weight:600}
      .sm{fill:#5b7186;font-size:13px}
      .flow{fill:none;stroke:#0f2740;stroke-width:2}
      .box{fill:#f7fafc;stroke:#d5e2ec;stroke-width:1.5}
      .step{fill:#0e8fa8;stroke:#0e8fa8}
      .stepT{fill:#ffffff;font-size:15px;font-weight:600}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>

  <text class="h" x="60" y="42">上位机参数通道：UART 115200 8N1 · 整组快照 · 带确认</text>
  <text class="n" x="60" y="68">一次只允许一个未完成事务；参数在真正开始一幅新校正帧时锁存，帧内不变，避免撕裂</text>

  <!-- 参数帧 -->
  <text class="lbl" x="60" y="110">下行参数帧（34 字节）</text>
  <g>
    <rect class="bH" x="60" y="126" width="90" height="54"/>
    <text class="bw" x="105" y="158" text-anchor="middle">0x81</text>
    <rect class="byte" x="150" y="126" width="70" height="54"/>
    <text class="bt" x="185" y="158" text-anchor="middle">SEQ_L</text>
    <rect class="byte" x="220" y="126" width="70" height="54"/>
    <text class="bt" x="255" y="158" text-anchor="middle">SEQ_H</text>

    <rect class="bP" x="290" y="126" width="640" height="54"/>
    <text class="bt" x="610" y="150" text-anchor="middle">6 × signed40 / Q24 逆仿射参数（30 字节）</text>
    <text class="bt" x="610" y="170" text-anchor="middle">h00 · h01 · h02 · h10 · h11 · h12</text>

    <rect class="bC" x="930" y="126" width="70" height="54"/>
    <text class="bt" x="965" y="158" text-anchor="middle">CRC_L</text>
    <rect class="bC" x="1000" y="126" width="70" height="54"/>
    <text class="bt" x="1035" y="158" text-anchor="middle">CRC_H</text>
  </g>
  <text class="sm" x="60" y="204">CRC-16/CCITT（多项式 0x1021，初值 0xFFFF），覆盖帧头、序号与 30 字节载荷；序号防止重复提交。</text>

  <!-- 应答帧 -->
  <text class="lbl" x="60" y="248">上行应答帧（5 字节）</text>
  <g>
    <rect class="bH" x="60" y="264" width="90" height="50"/>
    <text class="bw" x="105" y="294" text-anchor="middle">0x82</text>
    <rect class="byte" x="150" y="264" width="70" height="50"/>
    <text class="bt" x="185" y="294" text-anchor="middle">SEQ_L</text>
    <rect class="byte" x="220" y="264" width="70" height="50"/>
    <text class="bt" x="255" y="294" text-anchor="middle">SEQ_H</text>
    <rect class="byte" x="290" y="264" width="80" height="50"/>
    <text class="bt" x="330" y="294" text-anchor="middle">STATUS</text>
    <rect class="bC" x="370" y="264" width="140" height="50"/>
    <text class="bt" x="440" y="294" text-anchor="middle">CRC</text>
  </g>
  <text class="sm" x="60" y="338">STATUS 只在对应序号的新帧已锁定参数后返回 ACK；ACK 表示“已生效”，不表示整帧写回或显示完成。</text>

  <!-- 事务流程 -->
  <text class="lbl" x="60" y="386">一次参数更新的事务顺序</text>
  <g>
    <rect class="step" x="60" y="404" width="200" height="58" rx="6"/>
    <text class="stepT" x="160" y="428" text-anchor="middle">上位机发送整组参数</text>
    <text class="stepT" x="160" y="448" text-anchor="middle" font-size="12" font-weight="400">旋转角 / 缩放 / 平移</text>

    <rect class="step" x="300" y="404" width="190" height="58" rx="6"/>
    <text class="stepT" x="395" y="428" text-anchor="middle">FPGA 校验</text>
    <text class="stepT" x="395" y="448" text-anchor="middle" font-size="12" font-weight="400">帧头 · 序号 · CRC16</text>

    <rect class="step" x="530" y="404" width="210" height="58" rx="6"/>
    <text class="stepT" x="635" y="428" text-anchor="middle">跨时钟参数邮箱</text>
    <text class="stepT" x="635" y="448" text-anchor="middle" font-size="12" font-weight="400">27 MHz → 92.8125 MHz</text>

    <rect class="step" x="780" y="404" width="220" height="58" rx="6"/>
    <text class="stepT" x="890" y="428" text-anchor="middle">新帧首拍锁存</text>
    <text class="stepT" x="890" y="448" text-anchor="middle" font-size="12" font-weight="400">与本帧分块顺序一起锁定</text>

    <rect class="step" x="1040" y="404" width="240" height="58" rx="6"/>
    <text class="stepT" x="1160" y="428" text-anchor="middle">回送 ACK</text>
    <text class="stepT" x="1160" y="448" text-anchor="middle" font-size="12" font-weight="400">携带相同序号</text>
  </g>
  <path class="flow" d="M260,433 L300,433" marker-end="url(#a5)"/>
  <path class="flow" d="M490,433 L530,433" marker-end="url(#a5)"/>
  <path class="flow" d="M740,433 L780,433" marker-end="url(#a5)"/>
  <path class="flow" d="M1000,433 L1040,433" marker-end="url(#a5)"/>

  <line x1="60" y1="502" x2="1340" y2="502" stroke="#d5e2ec" stroke-width="1.5"/>
  <text class="n" x="60" y="528">异常处理：CRC 错误或序号重复直接丢弃；串口断流超过 40 个位时间清空半包；公共硬复位取消未提交事务，DDR 恢复保留最后参数。</text>
  <text class="n" x="60" y="550">该通道当前仅完成离线联合测试与无窗口自检，真实串口与面板联调需随相机一起上板复测【待确认】。</text>
</svg>
