<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="862" viewBox="0 0 1400 862" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2740"/>
    </marker>
    <style>
      .st{fill:#0f2740;stroke:#0f2740;stroke-width:2}
      .stA{fill:#0e8fa8;stroke:#0e8fa8;stroke-width:2}
      .pn{fill:#f7fafc;stroke:#d5e2ec;stroke-width:1.5}
      .h{fill:#0f2740;font-size:20px;font-weight:700}
      .n{fill:#3f5a70;font-size:14px}
      .w{fill:#ffffff;font-size:17px;font-weight:600}
      .wn{fill:#b7d3e2;font-size:13px}
      .f{fill:#0f2740;font-family:Consolas, 'Cascadia Mono', monospace;font-size:18px}
      .fc{fill:#0e8fa8;font-family:Consolas, 'Cascadia Mono', monospace;font-size:17px}
      .fl{fill:#7a5a2f;font-family:Consolas, 'Cascadia Mono', monospace;font-size:15px}
      .tag{fill:#0e8fa8;font-size:14px;font-weight:600}
      .line{fill:none;stroke:#0f2740;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="862" fill="#ffffff"/>

  <text class="h" x="60" y="42">逆映射 + Brown 畸变 + 仿射变换：合并为一次重采样</text>
  <text class="n" x="60" y="68">正向畸变把理想点映射到观测点；硬件从每个输出像素反向求出源坐标，因此输出不留空洞，也不需要两次插值</text>

  <!-- 阶段 1 -->
  <rect class="st" x="60" y="98" width="290" height="76" rx="6"/>
  <text class="w" x="80" y="128">① 目标像素坐标</text>
  <text class="wn" x="80" y="152">输出扫描位置 (x_d, y_d)</text>
  <rect class="pn" x="400" y="98" width="940" height="76" rx="6"/>
  <text class="f" x="420" y="128">x_d = 0 … 1919　　y_d = 0 … 1079</text>
  <text class="n" x="420" y="152">轴对齐时按光栅顺序；旋转时按 128×128 分块顺序，写回仍按真实地址</text>
  <path class="line" d="M205,174 L205,200" marker-end="url(#a3)"/>

  <!-- 阶段 2 -->
  <rect class="st" x="60" y="200" width="290" height="96" rx="6"/>
  <text class="w" x="80" y="230">② 逆仿射 H</text>
  <text class="wn" x="80" y="254">旋转 θ · 缩放 s · 平移 (t_x,t_y)</text>
  <text class="wn" x="80" y="276">6 项参数，Q24 定点</text>
  <rect class="pn" x="400" y="200" width="940" height="96" rx="6"/>
  <text class="f" x="420" y="234">[u v w]ᵀ = H · [x_d y_d 1]ᵀ　，　x_u = u / w　，　y_u = v / w</text>
  <text class="f" x="420" y="266">H = [ a  b  t_x ;  c  d  t_y ;  0  0  1 ]</text>
  <text class="n" x="420" y="288">a,b,c,d 由旋转与缩放合成；上位机下发整组参数，帧首锁存</text>
  <path class="line" d="M205,296 L205,322" marker-end="url(#a3)"/>

  <!-- 阶段 3 -->
  <rect class="st" x="60" y="322" width="290" height="76" rx="6"/>
  <text class="w" x="80" y="352">③ 理想源坐标</text>
  <text class="wn" x="80" y="376">未畸变的成像平面 (x_u, y_u)</text>
  <rect class="pn" x="400" y="322" width="940" height="76" rx="6"/>
  <text class="f" x="420" y="356">X = (x_u − c_x) / f_x　，　Y = (y_u − c_y) / f_y</text>
  <text class="n" x="420" y="380">归一化到相机坐标系，进入 Brown 模型</text>
  <path class="line" d="M205,398 L205,424" marker-end="url(#a3)"/>

  <!-- 阶段 4 -->
  <rect class="stA" x="60" y="424" width="290" height="120" rx="6"/>
  <text class="w" x="80" y="454">④ Brown 畸变模型</text>
  <text class="wn" x="80" y="478">二阶径向 k1/k2</text>
  <text class="wn" x="80" y="500">切向 p1/p2</text>
  <text class="wn" x="80" y="522">由 9×6 棋盘标定得到</text>
  <rect class="pn" x="400" y="424" width="940" height="120" rx="6"/>
  <text class="fc" x="420" y="456">r² = X² + Y²</text>
  <text class="fc" x="420" y="486">X′ = X · (1 + k1·r² + k2·r⁴) + 2·p1·X·Y + p2·(r² + 2·X²)</text>
  <text class="fc" x="420" y="514">Y′ = Y · (1 + k1·r² + k2·r⁴) + p1·(r² + 2·Y²) + 2·p2·X·Y</text>
  <text class="n" x="420" y="536">k3 固定为 0；k1、k2 为二阶径向，p1、p2 为切向</text>
  <path class="line" d="M205,544 L205,570" marker-end="url(#a3)"/>

  <!-- 阶段 5 -->
  <rect class="st" x="60" y="570" width="290" height="76" rx="6"/>
  <text class="w" x="80" y="600">⑤ 观测源坐标</text>
  <text class="wn" x="80" y="624">实际镜头成像位置 (x_s, y_s)</text>
  <rect class="pn" x="400" y="570" width="940" height="76" rx="6"/>
  <text class="f" x="420" y="604">x_s = f_x · X′ + c_x　，　y_s = f_y · Y′ + c_y</text>
  <text class="n" x="420" y="628">超出源图边界时标记 outside，最终填黑，避免越界读取</text>
  <path class="line" d="M205,646 L205,672" marker-end="url(#a3)"/>

  <!-- 阶段 6 -->
  <rect class="st" x="60" y="672" width="290" height="90" rx="6"/>
  <text class="w" x="80" y="702">⑥ 一次重采样</text>
  <text class="wn" x="80" y="726">2×2 邻域 + 分数 (f_x, f_y)</text>
  <text class="wn" x="80" y="746">双线性 / 最近邻</text>
  <rect class="pn" x="400" y="672" width="940" height="90" rx="6"/>
  <text class="f" x="420" y="704">I(p) = (1−f_y)·[(1−f_x)·P00 + f_x·P10] + f_y·[(1−f_x)·P01 + f_x·P11]</text>
  <text class="n" x="420" y="730">邻域由四邻域分块缓存提供：同一 128×2 瓦片内两次命中即复用一次 DDR 突发</text>
  <text class="n" x="420" y="752">最近邻模式保留锐利边缘，便于现场对照与低延迟场景</text>

  <!-- 定点说明 -->
  <line x1="60" y1="800" x2="1340" y2="800" stroke="#d5e2ec" stroke-width="1.5"/>
  <text class="tag" x="60" y="826">定点实现</text>
  <text class="fl" x="150" y="826">H: signed 40 bit / Q24　·　f_x,f_y,c_x,c_y: Q16　·　k1,k2,p1,p2: Q26　·　插值权重: UQ0.8　·　内部坐标: signed 40 bit</text>
  <text class="fl" x="150" y="848">畸变映射 11 级流水（E0 请求 → E10 响应）　·　双线性 3 级流水　·　单时钟周期一请求</text>
</svg>
