<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <style>
      .lane{fill:#f7fafc;stroke:#dbe6ee;stroke-width:1.5}
      .cap{fill:#0f2740;font-size:18px;font-weight:600}
      .sub{fill:#5b7186;font-size:14px}
      .blkA{fill:#0e8fa8;stroke:#0b7186;stroke-width:1.5}
      .blkB{fill:#7cc4d2;stroke:#0e8fa8;stroke-width:1.5}
      .blkC{fill:#0f2740;stroke:#0b1f31;stroke-width:1.5}
      .blkD{fill:#b45309;stroke:#8f4207;stroke-width:1.5}
      .blkE{fill:#e0a96d;stroke:#b45309;stroke-width:1.5}
      .blkF{fill:#e8eef4;stroke:#9bb0c0;stroke-width:1.5}
      .bt{fill:#ffffff;font-size:15px;font-weight:600}
      .bt2{fill:#0f2740;font-size:15px;font-weight:600}
      .note{fill:#3f5a70;font-size:14px}
      .tick{stroke:#9bb0c0;stroke-width:1;stroke-dasharray:3 4}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>

  <text class="cap" x="50" y="44">帧级并行：采集、矫正、显示三者重叠，稳态每 33.3 ms 产出一张新校正帧</text>
  <text class="sub" x="50" y="70">每一格为 1080p30 的一个显示周期（33.3 ms）；处理帧与采集帧使用不同源 Bank，互不覆盖</text>

  <!-- 时间轴 -->
  <line x1="230" y1="104" x2="1350" y2="104" stroke="#0f2740" stroke-width="2"/>
  <g class="tick">
    <line x1="230" y1="96" x2="230" y2="122"/><line x1="510" y1="96" x2="510" y2="122"/>
    <line x1="790" y1="96" x2="790" y2="122"/><line x1="1070" y1="96" x2="1070" y2="122"/>
    <line x1="1350" y1="96" x2="1350" y2="122"/>
  </g>
  <text class="sub" x="230" y="140" text-anchor="middle">t0</text>
  <text class="sub" x="510" y="140" text-anchor="middle">t0+33.3 ms</text>
  <text class="sub" x="790" y="140" text-anchor="middle">t0+66.6 ms</text>
  <text class="sub" x="1070" y="140" text-anchor="middle">t0+99.9 ms</text>
  <text class="sub" x="1350" y="140" text-anchor="middle">t0+133.2 ms</text>

  <!-- 采集泳道 -->
  <rect class="lane" x="40" y="168" width="1320" height="96" rx="6"/>
  <text class="cap" x="56" y="204" font-size="17">采集</text>
  <text class="sub" x="56" y="228">148.5 MHz</text>
  <rect class="blkA" x="232" y="184" width="272" height="62" rx="4"/>
  <text class="bt" x="368" y="212" text-anchor="middle">第 N 帧 → Bank 0</text>
  <text class="bt" x="368" y="234" text-anchor="middle" font-size="13" font-weight="400">整帧写入 DDR</text>
  <rect class="blkB" x="512" y="184" width="272" height="62" rx="4"/>
  <text class="bt2" x="648" y="212" text-anchor="middle">第 N+1 帧 → Bank 1</text>
  <text class="bt2" x="648" y="234" text-anchor="middle" font-size="13" font-weight="400">乒乓切换</text>
  <rect class="blkA" x="792" y="184" width="272" height="62" rx="4"/>
  <text class="bt" x="928" y="212" text-anchor="middle">第 N+2 帧 → Bank 0</text>
  <rect class="blkB" x="1072" y="184" width="272" height="62" rx="4"/>
  <text class="bt2" x="1208" y="212" text-anchor="middle">第 N+3 帧 → Bank 1</text>

  <!-- 处理泳道 -->
  <rect class="lane" x="40" y="284" width="1320" height="96" rx="6"/>
  <text class="cap" x="56" y="320" font-size="17">矫正</text>
  <text class="sub" x="56" y="344">92.8125 MHz</text>
  <rect class="blkF" x="232" y="300" width="272" height="62" rx="4"/>
  <text class="bt2" x="368" y="328" text-anchor="middle">上一帧收尾</text>
  <text class="bt2" x="368" y="350" text-anchor="middle" font-size="13" font-weight="400">参数在帧首锁定</text>
  <rect class="blkC" x="512" y="300" width="272" height="62" rx="4"/>
  <text class="bt" x="648" y="328" text-anchor="middle">处理第 N 帧</text>
  <text class="bt" x="648" y="350" text-anchor="middle" font-size="13" font-weight="400">坐标 → 缓存 → 插值 → 写回</text>
  <rect class="blkC" x="792" y="300" width="272" height="62" rx="4"/>
  <text class="bt" x="928" y="328" text-anchor="middle">处理第 N+1 帧</text>
  <rect class="blkC" x="1072" y="300" width="272" height="62" rx="4"/>
  <text class="bt" x="1208" y="328" text-anchor="middle">处理第 N+2 帧</text>

  <!-- 显示泳道 -->
  <rect class="lane" x="40" y="400" width="1320" height="96" rx="6"/>
  <text class="cap" x="56" y="436" font-size="17">显示</text>
  <text class="sub" x="56" y="460">74.25 MHz</text>
  <rect class="blkD" x="232" y="416" width="272" height="62" rx="4"/>
  <text class="bt" x="368" y="444" text-anchor="middle">显示第 N−1 帧</text>
  <text class="bt" x="368" y="466" text-anchor="middle" font-size="13" font-weight="400">上一完整结果</text>
  <rect class="blkE" x="512" y="416" width="272" height="62" rx="4"/>
  <text class="bt2" x="648" y="444" text-anchor="middle">显示第 N 帧</text>
  <text class="bt2" x="648" y="466" text-anchor="middle" font-size="13" font-weight="400">整帧边界切换，不撕裂</text>
  <rect class="blkD" x="792" y="416" width="272" height="62" rx="4"/>
  <text class="bt" x="928" y="444" text-anchor="middle">显示第 N+1 帧</text>
  <rect class="blkE" x="1072" y="416" width="272" height="62" rx="4"/>
  <text class="bt2" x="1208" y="444" text-anchor="middle">显示第 N+2 帧</text>

  <!-- 说明 -->
  <line x1="50" y1="516" x2="1350" y2="516" stroke="#dbe6ee" stroke-width="1.5"/>
  <text class="note" x="50" y="540">实板实测：连续 30 s 输出 900 张新校正帧；同名功能回归中最大新帧间隔 33,333,300 ns，无拒绝帧与当前故障计数。</text>
</svg>
