<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <style>
      .h{fill:#0f2740;font-size:20px;font-weight:700}
      .n{fill:#3f5a70;font-size:14px}
      .addr{fill:#ffffff;font-family:Consolas, monospace;font-size:16px;font-weight:600}
      .seg{stroke:#0f2740;stroke-width:2}
      .lbl{fill:#0f2740;font-size:17px;font-weight:600}
      .sm{fill:#5b7186;font-size:13px}
      .box{fill:#f7fafc;stroke:#d5e2ec;stroke-width:1.5}
      .cell{stroke:#ffffff;stroke-width:1}
      .cap{fill:#0e8fa8;font-size:14px;font-weight:600}
    </style>
  </defs>
  <rect width="1400" height="600" fill="#ffffff"/>

  <text class="h" x="60" y="42">DDR3 地址划分（按 32 位字编址，偏移以字为单位）</text>
  <text class="n" x="60" y="68">源图双 Bank 与结果双缓冲各自独立，帧代数（generation）防止跨帧误用；容量上限取决于板载颗粒【待确认】</text>

  <!-- 存储器条 -->
  <g>
    <rect class="seg" x="60" y="96" width="300" height="96" fill="#0e8fa8"/>
    <text class="addr" x="76" y="128">0x000_0000</text>
    <text class="lbl" x="76" y="156" fill="#ffffff">源图 Bank 0</text>
    <text class="sm" x="76" y="178" style="fill:#e6f6f9">1920×1080 字 · 8.29 MB</text>

    <rect class="seg" x="360" y="96" width="300" height="96" fill="#59b3c4"/>
    <text class="addr" x="376" y="128">0x080_0000</text>
    <text class="lbl" x="376" y="156" fill="#0b3446">源图 Bank 1</text>
    <text class="sm" x="376" y="178" style="fill:#0b3446">乒乓采集写入</text>

    <rect class="seg" x="660" y="96" width="300" height="96" fill="#0f2740"/>
    <text class="addr" x="676" y="128">0x100_0000</text>
    <text class="lbl" x="676" y="156" fill="#ffffff">结果帧 0</text>
    <text class="sm" x="676" y="178" style="fill:#b7d3e2">1920×1080 字 · 8.29 MB</text>

    <rect class="seg" x="960" y="96" width="300" height="96" fill="#1c4a6b"/>
    <text class="addr" x="976" y="128">0x200_0000</text>
    <text class="lbl" x="976" y="156" fill="#ffffff">结果帧 1</text>
    <text class="sm" x="976" y="178" style="fill:#b7d3e2">整帧写完后发布</text>
  </g>
  <text class="sm" x="60" y="218">地址间隔：Bank1 相对 Bank0 偏移 32 MB；结果区相对源区偏移 64 MB。每像素占 1 个 32 位字（RGB888 低 24 位）。</text>

  <!-- 缓存与突发 -->
  <rect class="box" x="60" y="250" width="620" height="300" rx="8"/>
  <text class="cap" x="80" y="280">四邻域缓存 · 瓦片结构</text>

  <!-- 网格 128x2 示意 -->
  <g>
    <rect x="80" y="300" width="576" height="36" fill="#eaf6f8" class="cell"/>
    <rect x="80" y="336" width="576" height="36" fill="#d6edf2" class="cell"/>
    <text class="sm" x="86" y="324">行 y：128 像素</text>
    <text class="sm" x="86" y="360">行 y+1：128 像素</text>
    <line x1="368" y1="300" x2="368" y2="372" stroke="#0e8fa8" stroke-width="3"/>
    <text class="cap" x="380" y="324">64 像素</text>
    <text class="cap" x="380" y="344">第一次突发</text>
  </g>
  <text class="sm" x="80" y="396">瓦片 128×2 像素；两行共享一次 128 像素引擎预取，拆成两次 64 像素突发。</text>
  <text class="sm" x="80" y="418">每条突发 = 64 个 32 位字 = 256 B；一次 DDR 读返回 8 拍 × 32 B。</text>

  <!-- 命中率小示意 -->
  <g>
    <rect x="80" y="440" width="180" height="80" rx="6" fill="#ffffff" stroke="#9bb0c0"/>
    <text class="lbl" x="96" y="468" font-size="15">128 行缓存</text>
    <text class="sm" x="96" y="490">双 Bank 读口</text>
    <text class="sm" x="96" y="508">按帧代数失效</text>

    <rect x="280" y="440" width="180" height="80" rx="6" fill="#ffffff" stroke="#9bb0c0"/>
    <text class="lbl" x="296" y="468" font-size="15">命中</text>
    <text class="sm" x="296" y="490">直接返回 2×2</text>
    <text class="sm" x="296" y="508">不占 DDR 带宽</text>

    <rect x="480" y="440" width="180" height="80" rx="6" fill="#ffffff" stroke="#9bb0c0"/>
    <text class="lbl" x="496" y="468" font-size="15">缺失</text>
    <text class="sm" x="496" y="490">64 像素突发填充</text>
    <text class="sm" x="496" y="508">看门狗超时标记</text>
  </g>

  <!-- 右侧：访问顺序 -->
  <rect class="box" x="720" y="250" width="620" height="300" rx="8"/>
  <text class="cap" x="740" y="280">两种访问顺序（同一帧内固定）</text>

  <rect x="740" y="300" width="580" height="86" rx="6" fill="#ffffff" stroke="#d5e2ec"/>
  <text class="lbl" x="758" y="328" font-size="16">轴对齐 / 仅镜头矫正：逐行光栅</text>
  <text class="sm" x="758" y="352">x_d 从左到右递增，源行局部性最好，两侧各 64 像素即可覆盖</text>
  <text class="sm" x="758" y="372">结果写回天然连续，适合 64 像素突发</text>

  <rect x="740" y="402" width="580" height="126" rx="6" fill="#ffffff" stroke="#d5e2ec"/>
  <text class="lbl" x="758" y="430" font-size="16">旋转 / 缩放：128×128 分块</text>
  <text class="sm" x="758" y="454">按块遍历目标区域，源像素在同一瓦片内被多次复用，降低重复读</text>
  <text class="sm" x="758" y="476">写回按真实输出地址，仍保证每笔 64 像素连续</text>
  <text class="sm" x="758" y="498">分块顺序在帧首随参数一起锁定，避免半帧切换导致地址错乱</text>
  <text class="sm" x="758" y="520">最后一行带按实际高度裁剪，不越界</text>

  <line x1="60" y1="574" x2="1340" y2="574" stroke="#d5e2ec" stroke-width="1.5"/>
  <text class="n" x="60" y="594">注：偏移量与参数见 RTL 默认值；若更换 DDR 颗粒或重排地址，需同步修改工程参数并重跑逐像素回归。</text>
</svg>
